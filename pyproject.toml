[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.1.0"
description = "Local-only job discovery and recommendation agent"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
jsa = "job_search_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
